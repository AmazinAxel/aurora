; Aurora — pomodoro e-ink watch firmware

[env:watch]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

extra_scripts = pre:tools/gen_assets.py

; QIO doubles the flash data lines over DIO, and 80 MHz halves the time spent
; fetching code that is not in cache -- which matters because every wake is a
; cold start from deep sleep.
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; No filesystem and no OTA, so a single large app partition.
board_build.partitions = huge_app.csv

; Nothing reads the serial port in normal use -- the watch is asleep.
board_build.extra_flags =
	-DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
	zinggjm/GxEPD2@^1.6.9
	adafruit/Adafruit GFX Library@^1.11.11

build_flags =
	-DCORE_DEBUG_LEVEL=0
	-Os
	-ffunction-sections
	-fdata-sections
	-fno-exceptions
	-fno-rtti
	-DCONFIG_BT_ENABLED=0
	-Wl,--gc-sections

build_unflags =
	-fexceptions
