; Aurora — pomodoro e-ink watch firmware

[env:watch]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; No asset hook: src/assets/cover.h is committed, so the build does not need
; the PNG or a generator present. Regenerate by hand when cover.png changes:
;   node tools/gen_assets.mjs cover.png src/assets/cover.h

; QIO doubles the flash data lines over DIO, and 80 MHz halves the time spent
; fetching code that is not in cache -- which matters because every wake is a
; cold start from deep sleep.
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; No filesystem and no OTA, so a single large app partition.
board_build.partitions = huge_app.csv

; Nothing reads the serial port in normal use -- the watch is asleep.
board_build.extra_flags =
	-DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
	zinggjm/GxEPD2@^1.6.9
	adafruit/Adafruit GFX Library@^1.11.11

; No -DCONFIG_BT_ENABLED=0 here: the framework ships a prebuilt sdkconfig.h
; that sets it to 1, so defining it on the command line only produced a
; redefinition warning in every framework translation unit. It never disabled
; Bluetooth -- that is baked into the precompiled libs.
;
; -fno-rtti and -fno-exceptions are C++-only and were warned about on every
; C file; they live in build_cxxflags instead.
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections

build_cxxflags =
	-fno-exceptions
	-fno-rtti

build_unflags =
	-fexceptions

; Throwaway VBUS probe: finds which GPIO tracks USB power. Excludes src/ so
; its setup() does not collide with the firmware's, and skips gen_assets.py
; and the display libs, which it has no use for.
[env:probe]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<../probe/probe.cpp>

; The CH9102 bridge is USB-powered, so unplugging makes the port vanish and it
; can come back on a different ttyACM number. Pin the by-id path or the
; monitor reconnects to a device that no longer exists and sits there silent.
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B0B042470-if00
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B0B042470-if00

; The dump is triggered by pressing Enter, which needs the keystroke actually
; sent rather than held in the monitor's line buffer.
monitor_filters = send_on_enter

build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_USB_CDC_ON_BOOT=0
