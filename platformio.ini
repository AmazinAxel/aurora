; Aurora — pomodoro e-ink watch firmware

[env:watch]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
upload_speed = 921600

; No asset hook: src/assets/cover.h is committed, so the build does not need
; the PNG or a generator present. Regenerate by hand when src/aurora.png
; changes:
;   node tools/gen_assets.mjs src/aurora.png src/assets/cover.h

; QIO doubles the flash data lines over DIO, and 80 MHz halves the time spent
; fetching code that is not in cache -- which matters because every wake is a
; cold start from deep sleep.
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; No filesystem and no OTA, so a single large app partition.
board_build.partitions = huge_app.csv

lib_deps =
	zinggjm/GxEPD2@^1.6.9
	adafruit/Adafruit GFX Library@^1.11.11

; The one flag that pays: without it the core compiles in its log strings
; (~18 KB). Section GC, -Os, -fno-rtti and -fno-exceptions were each measured
; to change nothing -- the core already applies or makes them moot.
build_flags =
	-DCORE_DEBUG_LEVEL=0
